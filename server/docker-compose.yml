version: '3.8'

services:
  cargenome-sync:
    build: .
    container_name: cargenome-sync-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in server/.env, see README}
      - DB_PATH=/app/data/cargenome.db
