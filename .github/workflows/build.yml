name: Build & Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine App Version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Determined Version: $VERSION, Release Tag: $TAG"

      - name: Run Unit Tests
        run: ./gradlew test testDebugUnitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          TAG="${{ steps.version.outputs.RELEASE_TAG }}"
          cp app/build/outputs/apk/debug/*.apk "build-output/CarGenome-${TAG}.apk"
          echo "Copied APK to build-output/CarGenome-${TAG}.apk"
          # The in-app updater refuses to install a release without this digest.
          (cd build-output && sha256sum "CarGenome-${TAG}.apk" > "CarGenome-${TAG}.apk.sha256")
          cat "build-output/CarGenome-${TAG}.apk.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarGenome-${{ steps.version.outputs.RELEASE_TAG }}
          path: build-output/CarGenome-${{ steps.version.outputs.RELEASE_TAG }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
          name: "CarGenome Release ${{ steps.version.outputs.RELEASE_TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build-output/CarGenome-${{ steps.version.outputs.RELEASE_TAG }}.apk
            build-output/CarGenome-${{ steps.version.outputs.RELEASE_TAG }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
